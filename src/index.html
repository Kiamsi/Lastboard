<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="row">
<div class="card">
<div class="value" id="bootTimeDisplay">--:--</div>
<div class="label">Time system started</div>
</div>

<div class="card">
<div class="value" id="uptimeDisplay">--:--:--</div>
<div class="label">Current session duration</div>
</div>

<div class="card">
<div class="value" id="processesDisplay">--</div>
<div class="label">Processes running</div>
</div>
</div>

<div class="row">
<div class="card">
<div class="value" id="networkSpeedDisplay">-- ↓ / -- ↑ Mbps</div>
<div class="label">Network Usage (Download/Upload)</div>
</div>

<div class="card">
<div class="value" id="connectionsDisplay">--</div>
<div class="label">Open Connections</div>
</div>
</div>

<div class="row">
<div class="card">
<div class="value" id="app-count">--</div>
<div class="label">Apps Installed</div>
</div>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
